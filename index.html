<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Krithik Naidu — AI / ML Engineer</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta
      name="description"
      content="Portfolio of Krithik Naidu: AI/ML engineer building LLM-powered and agentic systems."
    />
    <meta property="og:title" content="Krithik Naidu — AI / ML Engineer" />
    <meta
      property="og:description"
      content="LLM-powered and agentic systems, edge AI research and hackathon-winning products."
    />
    <meta name="theme-color" content="#222222" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #222222;
        --t: #f4f4f4;
        --d: #cfcfcf;
        --l1: rgba(20, 18, 18, 0);
        --l2: rgba(255, 255, 255, 0.3);
        --lf: rgba(255, 255, 255, 0.6);
        --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
        --disp: "Cormorant Garamond", Georgia, serif;
        --ui: "Inter", system-ui, sans-serif;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }

      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }

      html {
        scroll-behavior: smooth;
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--t);
        font: 400 14.2px/1.72 var(--ui);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }

      body.lock,
      body.mopen {
        overflow: hidden;
      }

      :focus-visible {
        outline: 2px solid #fff;
        outline-offset: 3px;
      }

      canvas#c {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        display: block;
      }

      .vig {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background: radial-gradient(
          ellipse at 50% 50%,
          transparent 45%,
          rgba(8, 8, 8, 0.55) 100%
        );
      }

      .prog {
        position: fixed;
        top: 0;
        left: 0;
        height: 2px;
        width: 100%;
        z-index: 95;
        background: #fff;
        transform: scaleX(0);
        transform-origin: left;
        box-shadow: 0 0 12px #fff;
      }

      .ring {
        position: fixed;
        z-index: 90;
        width: 34px;
        height: 34px;
        margin: -17px 0 0 -17px;
        border: 1.5px solid #fff;
        border-radius: 50%;
        pointer-events: none;
        left: -60px;
        top: -60px;
        transition:
          width 0.25s,
          height 0.25s,
          margin 0.25s,
          background 0.25s;
        mix-blend-mode: difference;
      }

      .ring.big {
        width: 64px;
        height: 64px;
        margin: -32px 0 0 -32px;
        background: #fff;
      }

      nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 70;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: calc(22px + env(safe-area-inset-top, 0px)) 3.4vw 14px;
        pointer-events: none;
      }

      nav > * {
        pointer-events: auto;
      }

      .logo {
        font: 700 24px var(--disp);
        letter-spacing: 0.2em;
        color: #fff;
        text-decoration: none;
        text-shadow: 0 0 12px #000;
      }

      .burger {
        width: 46px;
        height: 44px;
        background: none;
        border: 0;
        cursor: pointer;
        display: grid;
        align-content: center;
        gap: 7px;
        padding: 0;
      }

      .burger i {
        display: block;
        height: 2px;
        background: #fff;
        transition: 0.35s;
        box-shadow: 0 0 8px #000;
      }

      .burger i:nth-child(2) {
        width: 70%;
        margin-left: auto;
      }

      body.mopen .burger i:nth-child(1) {
        transform: translateY(9px) rotate(45deg);
      }

      body.mopen .burger i:nth-child(2) {
        opacity: 0;
      }

      body.mopen .burger i:nth-child(3) {
        transform: translateY(-9px) rotate(-45deg);
      }

      .mnu {
        position: fixed;
        inset: 0;
        z-index: 65;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        opacity: 0;
        pointer-events: none;
        visibility: hidden;
        transition:
          opacity 0.45s,
          visibility 0.45s;
        overflow-y: auto;
        padding: 80px 0 40px;
      }

      body.mopen .mnu {
        opacity: 1;
        pointer-events: auto;
        visibility: visible;
      }

      .mnu a {
        font: 600 clamp(1.5rem, 3.8vw, 2.5rem) var(--disp);
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #fff;
        text-decoration: none;
        padding: 5px 14px;
        transition: 0.3s;
        display: flex;
        gap: 18px;
        align-items: baseline;
      }

      .mnu a small {
        font: 500 11px var(--ui);
        letter-spacing: 0.2em;
        color: var(--d);
      }

      .mnu a:hover,
      .mnu a[aria-current] {
        letter-spacing: 0.4em;
      }

      .dots {
        position: fixed;
        right: 2.2vw;
        top: 50%;
        transform: translateY(-50%);
        z-index: 60;
        display: grid;
        gap: 12px;
      }

      .dots button {
        position: relative;
        width: 44px;
        height: 22px;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }

      .dots button::before {
        content: "";
        position: absolute;
        right: 0;
        top: 50%;
        width: 10px;
        height: 10px;
        margin-top: -5px;
        border-radius: 50%;
        border: 1.5px solid #fff;
        transition: 0.3s;
        box-shadow: 0 0 8px #000;
      }

      .dots button.on::before {
        background: #fff;
        transform: scale(1.4);
      }

      .dots button span {
        position: absolute;
        right: 24px;
        top: 50%;
        transform: translateY(-50%);
        font: 600 10px var(--ui);
        letter-spacing: 0.22em;
        text-transform: uppercase;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: 0.3s;
        background: var(--bg);
        padding: 4px 9px;
        border: 1px solid var(--l2);
        border-radius: 999px;
      }

      .dots button:hover span,
      .dots button:focus-visible span {
        opacity: 1;
      }

      .cnt {
        position: fixed;
        right: 3.4vw;
        bottom: calc(3.6vh + env(safe-area-inset-bottom, 0px));
        z-index: 60;
        font: 500 11px var(--ui);
        letter-spacing: 0.24em;
        text-transform: uppercase;
        text-shadow: 0 0 10px #000;
      }

      .snd {
        position: fixed;
        left: 3.4vw;
        bottom: calc(3.6vh + env(safe-area-inset-bottom, 0px));
        z-index: 60;
        display: flex;
        align-items: center;
        gap: 12px;
        background: none;
        border: 0;
        color: #fff;
        cursor: pointer;
        font: italic 500 15px var(--disp);
        padding: 10px 0;
        text-shadow: 0 0 10px #000;
      }

      .snd i {
        width: 20px;
        height: 20px;
        border: 1.5px solid #fff;
        border-radius: 50%;
        display: grid;
        place-items: center;
        flex: none;
      }

      .snd i::after {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #fff;
        opacity: 0.35;
      }

      .snd.on i::after {
        opacity: 1;
        animation: pu 1.4s ease-in-out infinite;
      }

      @keyframes pu {
        50% {
          transform: scale(1.9);
        }
      }

      section {
        position: relative;
        z-index: 5;
        padding: 0 6vw;
      }

      .sec {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding-top: 12vh;
        padding-bottom: 8vh;
      }

      .ttl {
        font: 600 clamp(1.45rem, 3vw, 2.3rem)/1.1 var(--disp);
        letter-spacing: 0.3em;
        margin-right: -0.3em;
        text-transform: uppercase;
        margin-bottom: 22px;
        color: #fff;
        display: inline-block;
        padding-bottom: 12px;
        border-bottom: 1px solid #fff;
        text-shadow: 0 0 14px #000;
        align-self: flex-start;
      }

      .lbl {
        font: 600 11px var(--ui);
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #fff;
        margin: 0 0 14px;
        padding-bottom: 9px;
        border-bottom: 1px solid var(--l1);
      }

      .panel {
        background:
          linear-gradient(
            145deg,
            rgba(255, 255, 255, 0.12),
            rgba(255, 255, 255, 0.03) 42%,
            rgba(0, 0, 0, 0.3)
          ),
          rgba(8, 8, 8, 0.5);
        border: 1px solid var(--l1);
        border-radius: 26px;
        padding: clamp(22px, 2.6vw, 38px);
        backdrop-filter: blur(22px) saturate(1.2);
        -webkit-backdrop-filter: blur(22px) saturate(1.2);
        box-shadow:
          0 24px 70px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.18);
        width: 100%;
        display: flex;
        flex-direction: column;
      }

      .w1 {
        max-width: 560px;
      }

      .w2 {
        max-width: 720px;
      }

      .w3 {
        max-width: 880px;
      }

      .pl {
        align-self: flex-start;
      }

      .pr {
        align-self: flex-end;
      }

      .panel p {
        margin: 0 0 16px;
        color: #fff;
        text-shadow: 0 0 10px #000;
      }

      .hero {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding-top: 6vh;
      }

      h1 {
        margin: 0;
        font: 600 clamp(2rem, 5.5vw, 4.9rem)/1 var(--disp);
        letter-spacing: 0.08em;
        color: #fff;
        text-shadow:
          0 0 28px rgba(255, 255, 255, 0.25),
          0 4px 24px #000;
        animation: ls 1.8s var(--ease) both;
      }

      h1 .w {
        display: inline-block;
        margin: 0 0.1em;
        white-space: nowrap;
      }

      h1 b {
        font-size: 1.18em;
        font-weight: 700;
      }

      @keyframes ls {
        from {
          opacity: 0;
          filter: blur(12px);
          transform: translateY(14px);
        }

        to {
          opacity: 1;
          filter: none;
          transform: none;
        }
      }

      .sub {
        display: flex;
        align-items: center;
        gap: 1.4em;
        margin: 20px 0 34px;
        font: 500 clamp(0.7rem, 1.15vw, 0.92rem) var(--ui);
        letter-spacing: 0.5em;
        text-transform: uppercase;
        color: #fff;
        text-shadow: 0 0 14px #000;
        animation: fi 1.6s 0.8s both;
      }

      .sub span {
        padding-left: 0.5em;
      }

      .sub i {
        display: block;
        width: clamp(28px, 4.5vw, 64px);
        height: 1px;
        background: #fff;
      }

      @keyframes fi {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
      }

      .pill {
        display: inline-block;
        font: 600 11px var(--ui);
        letter-spacing: 0.36em;
        text-transform: uppercase;
        color: #fff;
        text-decoration: none;
        padding: 16px 40px 16px calc(40px + 0.36em);
        border: 1px solid #fff;
        border-radius: 999px;
        background: var(--bg);
        transition: 0.35s;
        animation: fi 1.6s 1.1s both;
      }

      .pill:hover {
        background: #fff;
        color: #000;
        box-shadow: 0 0 40px rgba(255, 255, 255, 0.5);
      }

      .meta {
        position: absolute;
        bottom: calc(3.6vh + env(safe-area-inset-bottom, 0px));
        right: 6vw;
        font: 500 11px var(--ui);
        letter-spacing: 0.22em;
        text-transform: uppercase;
        text-align: right;
        line-height: 1.9;
        text-shadow: 0 0 10px #000;
      }

      .ed {
        display: grid;
        grid-template-columns: 170px 1fr;
        gap: 6px 24px;
        padding: 18px 0;
        border-bottom: 1px solid var(--l1);
      }

      .ed:last-child {
        border-bottom: 0;
      }

      .ed time {
        color: var(--d);
        font-size: 13px;
        padding-top: 5px;
      }

      .ed b {
        color: #fff;
        font: 600 20px/1.2 var(--disp);
        display: block;
      }

      .ed span {
        color: var(--d);
        font-size: 13px;
        display: block;
        margin-top: 3px;
      }

      .ed em,
      .stt {
        font: 600 11px var(--ui);
        font-style: normal;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #000;
        background: #fff;
        display: inline-block;
        padding: 4px 14px;
        margin-top: 10px;
        border-radius: 999px;
      }

      .sk {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px 34px;
      }

      .sk h4 {
        margin: 0 0 8px;
        font: 600 11px var(--ui);
        letter-spacing: 0.26em;
        text-transform: uppercase;
        padding-bottom: 7px;
        border-bottom: 1px solid var(--l1);
      }

      .chip {
        display: inline-block;
        font-size: 11.5px;
        padding: 4px 13px;
        border: 1px solid var(--l2);
        border-radius: 999px;
        margin: 0 5px 6px 0;
        color: #fff;
        background: rgba(255, 255, 255, 0.06);
        transition: 0.25s;
      }

      .chip:hover {
        background: #fff;
        color: #000;
      }

      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 5vw;
      }

      .lst div {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 14px;
        padding: 11px 0;
        border-bottom: 1px solid var(--l1);
        font-size: 13px;
      }

      .lst div span {
        color: var(--d);
        font-size: 12.5px;
        white-space: nowrap;
      }

      .lst p {
        margin: 0 !important;
        text-shadow: none !important;
      }

      .act {
        display: grid;
        grid-template-columns: 76px 1fr;
        gap: 2px 14px;
        padding: 11px 0;
        border-bottom: 1px solid var(--l1);
        font-size: 13px;
      }

      .act time {
        color: var(--d);
        font-size: 12px;
        padding-top: 3px;
      }

      .act b {
        font-weight: 500;
      }

      .act span {
        grid-column: 2;
        color: var(--d);
        line-height: 1.5;
      }

      .xp {
        padding: 22px 0;
        border-bottom: 1px solid var(--l1);
      }

      .xp:first-of-type {
        padding-top: 4px;
      }

      .xp:last-child {
        border-bottom: 0;
        padding-bottom: 0;
      }

      .xp .dt {
        font: 500 12px var(--ui);
        letter-spacing: 0.14em;
        color: var(--d);
        text-transform: uppercase;
      }

      .xp h3 {
        font: 600 clamp(1.35rem, 2.3vw, 1.85rem)/1.15 var(--disp);
        margin: 4px 0 3px;
      }

      .xp .org {
        display: block;
        color: var(--d);
        font-size: 13px;
        margin-bottom: 12px;
      }

      .xp ul {
        margin: 0 0 12px;
        padding-left: 20px;
        font-size: 13.5px;
      }

      .xp li {
        margin-bottom: 5px;
      }

      .stt {
        margin: 0 0 10px;
      }

      .proj {
        text-align: center;
        align-items: center;
      }

      .proj .q {
        max-width: 760px;
        font: italic 500 17px/1.5 var(--disp);
        margin: 0 0 20px;
        text-shadow: 0 0 12px #000;
      }

      .stage {
        position: relative;
        width: 100%;
        height: min(56vh, 400px);
        perspective: 1700px;
        margin-top: 10px;
      }

      .pc {
        position: absolute;
        left: 50%;
        top: 50%;
        width: min(72vw, 450px);
        height: 100%;
        margin-left: calc(min(72vw, 450px) / -2);
        transform-style: preserve-3d;
        transition:
          transform 1s var(--ease),
          opacity 0.6s;
        background:
          linear-gradient(
            145deg,
            rgba(255, 255, 255, 0.14),
            rgba(255, 255, 255, 0.04) 45%,
            rgba(0, 0, 0, 0.35)
          ),
          rgba(10, 10, 10, 0.66);
        border: 1px solid var(--l2);
        border-radius: 22px;
        overflow: hidden;
        text-align: left;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        box-shadow:
          0 24px 70px rgba(0, 0, 0, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.18);
      }

      .pc .art {
        flex: 1;
        display: grid;
        place-items: center;
        border-bottom: 1px solid var(--l1);
        background:
          repeating-linear-gradient(
            90deg,
            transparent 0 31px,
            rgba(255, 255, 255, 0.06) 31px 32px
          ),
          repeating-linear-gradient(
            0deg,
            transparent 0 31px,
            rgba(255, 255, 255, 0.06) 31px 32px
          );
      }

      .pc svg {
        width: 62%;
        max-height: 80%;
        fill: none;
        stroke: #fff;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .pc .in {
        padding: 18px 22px 20px;
      }

      .pc h3 {
        margin: 0;
        font: 600 clamp(1.5rem, 2.6vw, 2rem)/1.1 var(--disp);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .pc p {
        margin: 4px 0 0;
        font-size: 13.5px;
        color: var(--d);
      }

      .pc .v {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(0, 0, 0, 0.74);
        font: 600 13px var(--ui);
        letter-spacing: 0.34em;
        text-transform: uppercase;
        opacity: 0;
        transition: 0.35s;
      }

      .pc.c:hover .v,
      .pc.c:focus-visible .v {
        opacity: 1;
      }

      .nav2 {
        display: flex;
        gap: 24px;
        justify-content: center;
        align-items: center;
        margin-top: 26px;
      }

      .nav2 button {
        width: 50px;
        height: 50px;
        border: 1px solid #fff;
        border-radius: 50%;
        background: var(--bg);
        color: #fff;
        font-size: 18px;
        cursor: pointer;
        transition: 0.3s;
      }

      .nav2 button:hover {
        background: #fff;
        color: #000;
      }

      .nav2 span {
        font: 600 12px var(--ui);
        letter-spacing: 0.3em;
        min-width: 70px;
      }

      .aw {
        padding: 18px 0;
        border-bottom: 1px solid var(--l1);
        display: grid;
        grid-template-columns: 54px 1fr;
        gap: 16px;
        align-items: center;
      }

      .aw:last-child {
        border-bottom: 0;
      }

      .aw i {
        font: 600 34px/1 var(--disp);
        font-style: normal;
      }

      .aw b {
        display: block;
        font: 600 20px/1.2 var(--disp);
      }

      .aw span {
        color: var(--d);
        font-size: 13px;
      }

      .contact {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4vw;
        align-items: center;
      }

      .contact .panel {
        max-width: 560px;
      }

      form {
        display: grid;
        gap: 16px;
      }

      .f {
        position: relative;
      }

      .f label {
        position: absolute;
        left: 18px;
        top: 13px;
        font: 600 11px var(--ui);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        pointer-events: none;
      }

      .f input,
      .f textarea {
        width: 100%;
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid var(--l2);
        color: #fff;
        font: 400 16px var(--ui);
        padding: 36px 18px 12px;
        outline: none;
        border-radius: 14px;
        transition: 0.25s;
        resize: vertical;
      }

      .f textarea {
        min-height: 170px;
      }

      .f input:focus,
      .f textarea:focus {
        border-color: var(--lf);
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.2);
      }

      .row2 {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 18px;
        flex-wrap: wrap;
      }

      .soc {
        display: flex;
        gap: 14px;
      }

      .soc a {
        color: #fff;
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        transition: 0.3s;
      }

      .soc a:hover {
        transform: translateY(-4px) scale(1.12);
      }

      .soc svg {
        width: 30px;
        height: 30px;
        fill: currentColor;
      }

      .soc svg.l {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
      }

      .send {
        font: 600 12px var(--ui);
        letter-spacing: 0.32em;
        text-transform: uppercase;
        background: #fff;
        color: #000;
        border: 1px solid #fff;
        border-radius: 999px;
        padding: 17px 34px;
        cursor: pointer;

    <script>
      (function () {
        var L = document.getElementById("ld"),
          n = document.getElementById("ldn"),
          ln = document.getElementById("ldl"),
          st = document.getElementById("lds"),
          cv = document.getElementById("ldc"),
          x = cv.getContext("2d"),
          W,
          H,
          P = [],
          t0 = performance.now(),
          p = 0,
          ready = false,
          fin = false,
          M = [
            "Mapping terrain",
            "Waking the agents",
            "Aligning the gears",
            "Compiling research",
            "Ready",
          ],
          lm = -1;
        function rs() {
          W = cv.width = innerWidth;
          H = cv.height = innerHeight;
        }
        rs();
        addEventListener("resize", rs);
        for (var i = 0; i < 100; i++)
          P.push({
            x: Math.random() * W,
            y: Math.random() * H,
            vx: (Math.random() - 0.5) * 0.3,
            vy: (Math.random() - 0.5) * 0.3,
          });
        Promise.all([
          new Promise(function (r) {
            if (document.readyState === "complete") r();
            else addEventListener("load", r);
          }),
          (document.fonts && document.fonts.ready) || 0,
        ]).then(function () {
          ready = true;
        });
        setTimeout(function () {
          ready = true;
        }, 7000);
        function done() {
          if (fin) return;
          fin = true;
          L.classList.add("out");
          setTimeout(function () {
            document.body.classList.remove("ld");
          }, 350);
          setTimeout(function () {
            L.classList.add("gone");
          }, 1900);
        }
        function fr(now) {
          if (fin) return;
          requestAnimationFrame(fr);
          var tg = Math.min(ready ? 100 : 88, ((now - t0) / 3300) * 100);
          p += (tg - p) * 0.08;
          var q = Math.round(p);
          n.textContent = ("00" + q)
            .slice(-3)
            .replace(/^0+(?=\d{2})/, function (m) {
              return m;
            });
          n.textContent = (q < 10 ? "00" : q < 100 ? "0" : "") + q;
          ln.style.transform = "scaleX(" + p / 100 + ")";
          var m = Math.min(4, Math.floor(p / 25));
          if (m !== lm) {
            lm = m;
            st.textContent = M[m];
          }
          x.clearRect(0, 0, W, H);
          x.fillStyle = "rgba(255,255,255,.75)";
          for (var i = 0; i < P.length; i++) {
            var a = P[i];
            a.x += a.vx;
            a.y += a.vy;
            if (a.x < 0 || a.x > W) a.vx *= -1;
            if (a.y < 0 || a.y > H) a.vy *= -1;
            x.fillRect(a.x, a.y, 1.4, 1.4);
            for (var j = i + 1; j < P.length; j++) {
              var b = P[j],
                dx = a.x - b.x,
                dy = a.y - b.y,

                x.lineTo(b.x, b.y);
